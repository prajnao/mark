      <section class="tab-content-wrapper" data-panel="settings" role="tabpanel">
        <div class="tab-body tab-body--start">
          <div class="section-head">
            <span class="section-title">Auto reload</span>
            <span class="badge">Coming soon</span>
          </div>
      
          <p class="section-note">Re-render the document when the file changes on disk.</p>
      
          <div class="setting-row is-disabled">
            <span class="setting-label">Enable</span>
            <label class="switch">
              <input type="checkbox" id="auto-reload" disabled />
              <span class="switch-track"></span>
            </label>
          </div>
      
          <div class="setting-row is-disabled">
            <span class="setting-label">Check every</span>
            <select class="select" id="auto-reload-interval" disabled>
              <option value="2">2 seconds</option>
              <option value="5">5 seconds</option>
              <option value="10">10 seconds</option>
              <option value="30">30 seconds</option>
            </select>
          </div>
        </div>
      </section>

      <section class="tab-content-wrapper" data-panel="appearance" role="tabpanel" hidden>
        <div class="tab-body tab-body--start">
          <div class="setting-row">
            <span class="setting-label">Theme</span>
            <select class="select" id="theme-mode">
              <option value="system">System</option>
              <option value="light">Light</option>
              <option value="dark">Dark</option>
            </select>
          </div>
          

          <div class="swatches" id="theme-swatches" data-mode="light" role="radiogroup" aria-label="Theme preset">
            <button class="swatch is-selected" type="button" role="radio" aria-checked="true" data-theme="white" data-group="light">White</button>
            <button class="swatch" type="button" role="radio" aria-checked="false" data-theme="paper" data-group="light">Paper</button>
            <button class="swatch" type="button" role="radio" aria-checked="false" data-theme="dawn" data-group="light">Dawn</button>

            <button class="swatch is-selected" type="button" role="radio" aria-checked="true" data-theme="carbon" data-group="dark">Carbon</button>
            <button class="swatch" type="button" role="radio" aria-checked="false" data-theme="ink" data-group="dark">Ink</button>
            <button class="swatch" type="button" role="radio" aria-checked="false" data-theme="onyx" data-group="dark">Onyx</button>
          </div>

          <div class="divider"></div>

          <div class="setting-row">
            <span class="setting-label">Sidebar</span>
            <div class="segmented" role="radiogroup" aria-label="Sidebar mode">
              <button class="segment is-selected" type="button" role="radio" aria-checked="true" data-sidebar="floating">Floating</button>
              <button class="segment" type="button" role="radio" aria-checked="false" data-sidebar="fixed">Fixed</button>
            </div>
          </div>

          <div class="setting-row">
            <span class="setting-label">Font</span>
            <select class="select" id="font-family">
              <option value="sans">Sans</option>
              <option value="serif">Serif</option>
              <option value="mono">Mono</option>
            </select>
          </div>

          <div class="setting-row">
            <span class="setting-label">Font size</span>
            <div class="stepper">
              <button class="stepper-btn" type="button" id="font-size-down" aria-label="Decrease font size">
                <span class="glyph glyph--sm">A</span>
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
              </button>
              <button class="stepper-btn" type="button" id="font-size-up" aria-label="Increase font size">
                <span class="glyph glyph--lg">A</span>
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="18 15 12 9 6 15"/></svg>
              </button>
            </div>
          </div>

          <div class="setting-row">
            <span class="setting-label">Spacing</span>
            <div class="stepper">
              <button class="stepper-btn" type="button" id="spacing-down" aria-label="Decrease line spacing">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 9h16M4 12h16M4 15h16"/></svg>
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
              </button>
              <button class="stepper-btn" type="button" id="spacing-up" aria-label="Increase line spacing">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="18 15 12 9 6 15"/></svg>
              </button>
            </div>
          </div>

          <!-- <div class="setting-row">
            <span class="setting-label">Width</span>
            <div class="segmented" role="radiogroup" aria-label="Content width">
              <button class="segment is-selected" type="button" role="radio" aria-checked="true" data-width="centered">Centered</button>
              <button class="segment" type="button" role="radio" aria-checked="false" data-width="full">Full</button>
            </div>
          </div> -->

          <div class="setting-row">
            <span class="setting-label">Width</span>
            <div class="stepper">
              <button class="stepper-btn" type="button" id="width-down" aria-label="Decrease content width">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M8 8h8M8 12h8M8 16h8"/></svg>
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="6 9 12 15 18 9"/></svg>
              </button>
              <button class="stepper-btn" type="button" id="width-up" aria-label="Increase content width">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M3 8h18M3 12h18M3 16h18"/></svg>
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="18 15 12 9 6 15"/></svg>
              </button>
            </div>
          </div>

          <button class="reset-btn" type="button" id="reset-appearance">Reset to default</button>
        </div>
      </section>
